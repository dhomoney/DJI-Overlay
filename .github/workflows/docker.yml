name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: dhomoney/dji-overlay

jobs:
  publish:
    runs-on: ubuntu-latest
    # Forks cannot push, and they do not have the secrets anyway.
    if: github.repository_owner == 'dhomoney'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds proves the image assembles, not that it runs. The
      # digest is pinned rather than a tag so this is unambiguously the image
      # that was just pushed.
      - name: Smoke test the pushed image
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          docker run --rm "$IMAGE_REF" --version

          # The CLI path: parse telemetry with the bundled ffmpeg and numpy.
          docker run --rm -v "$PWD/tests/fixtures:/media:ro" "$IMAGE_REF" \
              inspect /media/neo2_landing.srt --rows 3

          # The web path: the optional extra is installed, uvicorn binds 0.0.0.0
          # inside the container, and the published port actually reaches it.
          docker run -d --name dji-overlay-smoke -p 127.0.0.1:8787:8787 \
              -v "$PWD/tests/fixtures:/media:ro" "$IMAGE_REF" serve
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8787/api/config > /tmp/config.json; then break; fi
            sleep 2
          done
          python3 -c "import json; c = json.load(open('/tmp/config.json')); print('serving', c['media_root'], 'templates', c['templates'])"
          docker logs dji-overlay-smoke
          docker rm -f dji-overlay-smoke

      # The README is the image's front page on Docker Hub, and a stale one
      # there is worse than none. Same credentials as the push: a second token
      # scoped to descriptions is not worth the management.
      - name: Update the Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
