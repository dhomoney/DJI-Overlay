[project]
name = "dji-overlay"
version = "0.1.0"
description = "Burn DJI flight telemetry onto your footage as a DJI-style HUD"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
dji-overlay = "dji_overlay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dji_overlay"]

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
