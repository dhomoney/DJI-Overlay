[project]
name = "dji-overlay"
version = "0.1.1"
description = "Burn DJI flight telemetry onto your footage as a DJI-style HUD"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "click>=8.1",
    "rich>=13.7",
    "playwright>=1.40",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "dji-overlay[web]"]

[project.scripts]
dji-overlay = "dji_overlay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dji_overlay"]

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
# DJI writes local wall-clock timestamps with no timezone, and the SRT gives no
# way to recover one. Attaching a tzinfo would state something we do not know.
ignore = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Chromium and ffmpeg"]
